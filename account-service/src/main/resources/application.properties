# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8081
spring.application.name=account-service

# ─── H2 File-Based Database ───────────────────────────────────────────────────
# Each service has its own separate file. Never share this path.
spring.datasource.url=jdbc:h2:file:./data/account-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console – for development inspection only
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JWT ──────────────────────────────────────────────────────────────────────
# In production set the JWT_SECRET environment variable to a real Base64 secret.
# The fallback below is a development-only placeholder. NEVER use in production.
jwt.secret=${JWT_SECRET:bXktc3VwZXItc2VjcmV0LWtleS10aGF0LWlzLWxvbmctZW5vdWdoLWZvci1IUzI1Ng==}
jwt.expiration-ms=86400000

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.ridelink=INFO
