# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8083
spring.application.name=ride-service

# ─── H2 File-Based Database ───────────────────────────────────────────────────
# Isolated per-service database file. Never shared with other services.
spring.datasource.url=jdbc:h2:file:./data/ride-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JWT Security ─────────────────────────────────────────────────────────────
# Shared secret for local JWT validation issued by Account Service
jwt.secret=${JWT_SECRET:bXktc3VwZXItc2VjcmV0LWtleS10aGF0LWlzLWxvbmctZW5vdWdoLWZvci1IUzI1Ng==}
jwt.expiration-ms=86400000

# ─── Interservice Communication URLs & Security ──────────────────────────────
driver.service.url=${DRIVER_SERVICE_URL:http://localhost:8082}
fare.service.url=${FARE_SERVICE_URL:http://localhost:8084}
internal.service-key=${INTERNAL_SERVICE_KEY:ridelink-internal-secret-key-2026}

# ─── Actuator & Management ────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.ridelink=INFO
